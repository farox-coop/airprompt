<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AirPrompt - Mobile Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="pull-indicator"><div id="pull-spinner"></div></div>

  <div id="session-bar">
    <span id="session-label">No session selected</span>
    <button id="dictate-btn"><span id="dictate-icon">🎤</span> <span id="dictate-label">Dictate</span></button>
  </div>

  <div id="session-modal">
    <div id="session-modal-content">
      <h3>Active Sessions</h3>
      <div id="session-list"></div>
      <button id="modal-close">Close</button>
    </div>
  </div>

  <div id="terminal-container"></div>
  <div id="mic-error"></div>

  <script src="client.js"></script>
</body>
</html>
