name: CI - Attach install assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach assets to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          echo "tag=${{ github.event.release.tag_name || github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Attach install.sh + install.ps1 as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            install.sh install.ps1 --clobber
