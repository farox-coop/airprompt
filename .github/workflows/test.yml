name: CI - Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: unit + integration tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - run: npm ci

      # node-pty (native dep) compiles from source on Linux; tmux is needed
      # by the integration suite. build-essential + python3 satisfy node-gyp.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux build-essential python3

      - run: make test-all
