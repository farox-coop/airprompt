name: CI - Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Run airprompt quality checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      # node-pty (native dep) compiles from source on Linux; tmux is needed
      # by the integration suite. build-essential + python3 satisfy node-gyp.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux build-essential python3 shellcheck

      - run: make lint
      - run: make format-check
      - run: make agnostic-check
      - run: make test-unit
      - run: make test-integration
